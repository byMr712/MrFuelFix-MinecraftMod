plugins {
    id 'fabric-loom' version "1.18-SNAPSHOT"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', '--short', 'HEAD']
            ignoreExitValue = true
        }
        return result.getResult().get().getExitValue() != 0 ? "<UnknownCommit>" : result.standardOutput.asText.get().strip()
    } catch (Exception e) {
        return "<UnknownCommit>"
    }
}

def buildtime = { System.currentTimeSeconds() }
processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def version = project.version

    inputs.properties("version": version, "commit": hash, "buildtime": time, "minecraft_version": project.minecraft_version)
    filesMatching("fabric.mod.json") {
        expand "version": version, "commit": hash, "buildtime": time
    }
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": version, "commit": hash, "buildtime": time, "minecraft_version": project.minecraft_version
    }
}

loom {
    if (project.minecraft_version.startsWith('26')) {
        noIntermediateMappings()
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (project.minecraft_version.startsWith('26')) {
        mappings files("empty-mappings.jar")
    } else {
        mappings loom.officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    def fabricApi = project.findProperty('fabric_api_version') ?: project.findProperty('fabric_version')
    if (fabricApi) {
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
    }
}

def targetJavaVersion = project.minecraft_version.startsWith('26') ? 25 : 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    exclude 'META-INF/neoforge.mods.toml'
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

remapJar {
    archiveFileName = "${project.archives_base_name}.jar"
}

def neoforgeArchiveBaseName = project.archives_base_name.replace('-Fabric-', '-NeoForge-')

tasks.register('neoforgeJar', Jar) {
    archiveFileName = "${neoforgeArchiveBaseName}.jar"
    from sourceSets.main.output
    exclude 'fabric.mod.json'
    exclude 'com/mr712/furnacefuelfix/FurnaceFuelFixMod.class'
    from("LICENSE") {
        rename { "${it}_${neoforgeArchiveBaseName}" }
    }
}

assemble.dependsOn neoforgeJar

tasks.matching { it.name == 'sourcesJar' || it.name == 'remapSourcesJar' || it.name == 'javadocJar' }.configureEach {
    enabled = false
}